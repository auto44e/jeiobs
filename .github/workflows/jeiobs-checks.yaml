name: jeiobs quick checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'jeiobs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jeiobs-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/jeiobs/check_scaffold.py
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          # After a force push the "before" commit may no longer exist (it was
          # rewritten away); fall back to checking the head commit instead of
          # failing on "bad object".
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            [[ -n "$BASE_SHA" ]] && echo "Base $BASE_SHA not available; checking HEAD only."
            git show --format= --check HEAD
          fi
