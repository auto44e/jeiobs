name: jeiobs workspace library
on:
  pull_request:
    branches: [main]
    paths: ['shared/jeiobs-workspace/**', 'tools/jeiobs/unicode/**', 'deps/blake2/**', '.github/workflows/jeiobs-workspace.yaml']
  push:
    branches: [main, 'jeiobs/**']
    paths: ['shared/jeiobs-workspace/**', 'tools/jeiobs/unicode/**', 'deps/blake2/**', '.github/workflows/jeiobs-workspace.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jeiobs-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    if: github.repository == 'auto44e/jeiobs'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install nlohmann_json (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nlohmann-json3-dev ninja-build
      - name: Install nlohmann_json (macOS)
        if: runner.os == 'macOS'
        run: brew install nlohmann-json ninja
      - name: Install nlohmann_json (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install nlohmann-json:x64-windows
      - name: Fetch the pinned Unicode data (Ubuntu)
        if: runner.os == 'Linux'
        run: tools/jeiobs/unicode/fetch-ucd.sh "$RUNNER_TEMP/ucd"
      - name: Configure
        shell: bash
        run: |
          args=(-S shared/jeiobs-workspace -B build)
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=("-DJW_UCD_DIR=$RUNNER_TEMP/ucd")
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(-A x64 "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")
          else
            args+=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo)
          fi
          cmake "${args[@]}"
      - name: Build
        run: cmake --build build --config RelWithDebInfo
      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
